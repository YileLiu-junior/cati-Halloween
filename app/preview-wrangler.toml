name = "peti-avatar-preview"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PETI_TEST_MODE = "true"
CUSTOM_GENERATION_ENABLED = "true"
FREE_GENERATION_ENABLED = "true"
PAYMENT_ENABLED = "false"
PETI_PUBLIC_ORIGIN = "https://peti-avatar-preview.pages.dev"
AFDIAN_PLAN_ID = "preview-plan"
AFDIAN_SKU_ID = "preview-sku"
# 打赏入口是真实的爱发电商品页；测试站不启用订单支付。
AFDIAN_SUPPORT_URL = "https://afdian.com/order/create?product_type=1&plan_id=2315e4b0d2e911f186f652540025c377&sku=%5B%7B%22sku_id%22%3A%22231df344d2e911f1b46452540025c377%22,%22count%22%3A1%7D%5D&viokrz_ex=0"

[[kv_namespaces]]
binding = "PETI_KV"
id = "2e1de97ed02a4ca197bb7126ae7c7570"

[[r2_buckets]]
binding = "PETI_IMAGES"
bucket_name = "peti-avatar-preview-images"

[[d1_databases]]
binding = "PETI_DB"
database_name = "peti-avatar-preview-orders"
database_id = "edba2d88-79dc-4700-a7a9-4d8e00e128e4"
migrations_dir = "migrations"

[[queues.producers]]
binding = "PETI_DELIVERY_QUEUE"
queue = "peti-avatar-preview-delivery"
