<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>答题 · 喵灵万圣节</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="page">
      <div class="progress" id="progress">第 1 / 10 题</div>
      <div class="scene" id="scene"></div>
      <h2 id="qtext"></h2>
      <div id="options"></div>
      <div class="row">
        <button id="prevBtn" class="secondary hidden">上一题</button>
        <button id="nextBtn" class="primary" disabled>下一题</button>
      </div>
      <div id="quizError" class="error hidden" role="alert"></div>
    </main>
    <script src="/js/config.js"></script>
    <script type="module" src="/js/quiz.js"></script>
  </body>
</html>
