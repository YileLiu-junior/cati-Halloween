<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><meta name="referrer" content="no-referrer" /><title>头像订单与售后 · PETI</title><link rel="stylesheet" href="/css/style.css" /></head>
<body><main class="page avatar-admin"><p class="custom-kicker">PETI · 订单工作台</p><h1>头像订单与售后</h1>
<form id="adminLogin"><label class="field"><span>管理员凭证</span><input id="adminSecret" type="password" autocomplete="off" required /></label><button class="primary" type="submit">查看订单</button></form>
<p id="adminStatus" role="status" aria-live="polite"></p><p id="adminError" class="error hidden" role="alert"></p>
<section id="adminContent" class="hidden"><button id="adminRefresh" class="secondary">刷新</button><button id="adminLogout" class="text-button">退出</button>
<h2>退款审核</h2><p class="custom-note">先核实付款，再审核。通过后前往爱发电处理资金，取得成功凭证后登记已退款。</p>
<form id="reviewForm"><label class="field"><span>待处理申请</span><select id="reviewId" required></select></label><div id="refundDetail" class="custom-note"></div>
<button id="reviewImages" type="button" class="text-button">查看原始照片与成品</button><div id="adminImages" class="admin-images hidden"></div>
<label class="field"><span>操作</span><select id="reviewAction"><option value="approve">批准退款</option><option value="needs_info">请求补充信息</option><option value="reject">驳回并说明原因</option><option value="processing">登记退款处理中</option><option value="refunded">登记实际退款成功</option></select></label>
<label class="field"><span>审核说明</span><textarea id="reviewNote" maxlength="500" rows="3"></textarea></label>
<div id="refundProof" class="hidden"><label class="field"><span>实际退款渠道</span><input id="reviewChannel" maxlength="80" placeholder="爱发电原路退款 / 已核实的其他渠道" /></label><label class="field"><span>成功凭证编号</span><input id="reviewProof" maxlength="200" /></label><label class="field"><span>实际退款金额（元）</span><input id="reviewAmount" type="number" min="0.01" step="0.01" /></label></div>
<button id="reviewSubmit" type="submit" class="secondary">保存审核</button></form>
<p><a href="https://afdian.com/dashboard/sponsored-bill" target="_blank" rel="noopener noreferrer">打开爱发电收款记录 ↗</a></p>
<h2>最近订单</h2><div class="admin-table-wrap"><table><thead><tr><th>网站订单</th><th>交付状态</th><th>支付金额</th><th>退款状态</th><th>核对</th></tr></thead><tbody id="adminOrders"></tbody></table></div>
<h2>待核对的提醒</h2><p class="custom-note">发送结果未知时，先检查爱发电私信。确认未发送后再补发，避免重复通知。</p><div id="adminNotifications"></div>
<details><summary>生成与通知诊断</summary><pre id="adminDiagnostics"></pre></details>
</section></main><script type="module" src="/js/avatar-admin.js"></script></body></html>
