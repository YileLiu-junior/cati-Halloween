<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#21191d" />
    <title>喵灵万圣节 · 你家毛孩子是哪只小怪物？</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="page home-page">
      <section class="hero-stage" aria-label="喵灵万圣节宠物测评">
        <img class="hero" src="/assets/hero.png" alt="喵灵万圣节，猫咪和狗狗的万圣节派对" fetchpriority="high" />
        <div class="hero-form">
          <p class="tagline">10 题，发现毛孩子的万圣节身份</p>
          <div class="type-toggle" role="group" aria-label="宠物类型">
            <button type="button" class="type-btn" data-type="cat" aria-pressed="true">🐱 猫咪</button>
            <button type="button" class="type-btn" data-type="dog" aria-pressed="false">🐶 狗狗</button>
          </div>
          <label class="field" for="petName">
            <span>请输入宠物姓名</span>
            <input id="petName" maxlength="24" autocomplete="off" aria-describedby="nameError" />
          </label>
          <div id="nameError" class="error hidden" role="alert"></div>
          <button id="startBtn" class="hero-start">开始测试 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></button>
          <button id="continueBtn" class="text-button hidden">继续未完成的测试 <span aria-hidden="true">↗</span></button>
          <div id="globalError" class="error hidden" role="alert"></div>
        </div>
      </section>
      <section id="historySection" class="history-section hidden" aria-labelledby="historyTitle">
        <div class="section-heading"><h2 id="historyTitle">毛孩子的身份收藏</h2><span>本浏览器记录</span></div>
        <div id="historyList" class="history-list"></div>
      </section>
      <p class="browser-note">请使用测评时的浏览器查看历史结果。<br />清除网站数据或更换浏览器后，记录将无法显示。</p>
    </main>
    <script src="/js/config.js"></script>
    <script type="module" src="/js/audio.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
